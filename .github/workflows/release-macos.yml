name: Release macOS app

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to publish (leave blank for a build only)
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.release_tag || (github.ref_type == 'tag' && github.ref_name) || '' }}

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG && format('refs/tags/{0}', env.RELEASE_TAG) || github.sha }}
      - name: Check release version
        if: env.RELEASE_TAG != ''
        run: test "$RELEASE_TAG" = "v$(node -p 'require("./package.json").version')"
      - name: Test launcher logic
        run: |
          node tests/core.test.js
          node tests/save-policy.test.js
          node tests/runtime-manager.test.js
      - name: Package app
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/package-macos.sh "${{ matrix.arch }}"
      - name: Test the app from the release ZIP
        run: |
          smoke="$(mktemp -d)"
          trap 'rm -rf -- "$smoke"' EXIT
          ditto -x -k dist/*.zip "$smoke"
          app="$smoke/Electron Game Bridge.app"
          codesign --verify --deep --strict "$app"
          "$app/Contents/MacOS/Electron Game Bridge" --library-smoke-test --test-root="$smoke/library" -ApplePersistenceIgnoreState YES
          test -f "$smoke/library/library/library.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-${{ matrix.arch }}
          path: dist/*.zip
          if-no-files-found: error
          compression-level: 0

  release:
    if: inputs.release_tag != '' || github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: macos-release-${{ inputs.release_tag || github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: macos-*
          merge-multiple: true
          path: dist
      - name: Publish both macOS apps
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${RELEASE_TAG#v}"
          assets=("Electron-Game-Bridge-${version}-macos-arm64.zip" "Electron-Game-Bridge-${version}-macos-x64.zip")
          sha256sum "${assets[@]}" > SHA256SUMS.txt
          if draft=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft); then
            if [ "$draft" != true ]; then
              echo "Release $RELEASE_TAG is already published."
              exit 0
            fi
          else
            gh release create "$RELEASE_TAG" --draft --repo "$GITHUB_REPOSITORY" --verify-tag \
              --generate-notes --title "Electron Game Bridge $RELEASE_TAG" \
              --notes 'Download the ZIP for your Mac (arm64 for Apple silicon, x64 for Intel), then extract and open Electron Game Bridge.app. The app includes Electron. This build is ad hoc signed and has no Apple notarization.'
          fi
          gh release upload "$RELEASE_TAG" "${assets[@]}" SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
