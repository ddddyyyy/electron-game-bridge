<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; object-src 'none'; frame-src 'none'; base-uri 'none'"><meta name="viewport" content="width=device-width,initial-scale=1"><title>游戏库</title><link rel="stylesheet" href="styles.css"></head>
<body>
<div class="app-shell"><aside class="navigation"><div class="brand"><span class="brand-icon" aria-hidden="true">✣</span>游戏库</div><nav aria-label="主导航"><button id="nav-library" class="nav-active" type="button">▦　游戏库</button><button id="nav-runtime" type="button">▱　运行时</button><button id="nav-settings" type="button">⚙　配置恢复</button></nav><p class="sidebar-note">你的游戏<br>在这里，轻松开始。</p><span class="local-note">本地游戏 · 本地数据</span></aside>
<main class="content"><header><div><span class="eyebrow">所有精彩，随时开始</span><h1>我的游戏</h1></div><button id="add" class="primary" type="button">＋ 添加游戏</button></header>
<p id="message" role="status" aria-live="polite"></p>
<section id="recovery" class="surface" hidden><h2>配置与恢复</h2><p id="recovery-text"></p><button id="restore" type="button">恢复上次有效配置</button><button id="reload" type="button">重新载入</button></section>
<div id="workspace"><section aria-label="选择游戏"><div id="games" class="cards"></div></section>
<section id="selected-detail" class="selected-detail surface" aria-labelledby="detail-title"><div id="detail-art" class="detail-art"></div><div class="detail-info"><span class="eyebrow">现在开始你的下一段旅程</span><h2 id="detail-title">选择一款游戏</h2><div class="badges"><span id="game-status" class="badge">等待选择</span><span id="detail-runtime" class="badge"></span><span class="badge">本地安装</span></div><p id="detail-path" class="muted"></p><div class="actions"><button id="launch" class="primary" type="button">▶ 启动游戏</button><button id="settings" type="button">⚙ 游戏设置</button></div></div></section></div>
<footer>游戏与运行时由用户本地提供。</footer></main></div>
<section id="settings-panel" class="overlay" role="dialog" aria-modal="true" aria-labelledby="settings-title" hidden><div class="panel"><div class="panel-heading"><div><span class="eyebrow">独立配置，安心保存</span><h2 id="settings-title">游戏设置</h2></div><button id="close-settings" type="button" aria-label="关闭游戏设置">×</button></div>
<form id="game-form"><fieldset id="game-fields" class="plain-fieldset"><label>游戏名称<input id="name" required maxlength="120"></label>
<label>安装目录<span class="picker"><input id="install" required placeholder="选择本地游戏目录"><button type="button" data-pick="gameDirectory" data-target="install">选择…</button></span></label>
<label>游戏图像（可选）<span class="picker"><input id="icon" placeholder="不设置也可正常使用；PNG，最大 4 MiB / 4096×4096"><button type="button" data-pick="icon" data-target="icon">选择…</button></span></label>
<div class="row"><label>应用入口<span class="picker"><input id="entry" value="." required><button type="button" data-pick="appEntry" data-target="entry">选择…</button></span></label><label>工作目录<span class="picker"><input id="cwd" value="." required><button type="button" data-pick="workingDirectory" data-target="cwd">选择…</button></span></label></div>
<div class="runtime-resolution"><strong>Electron 运行环境 · 自动识别</strong><output id="runtime-result" aria-live="polite">选择游戏目录后自动识别</output><button id="resolve-runtime" type="button">重新检查</button><button id="open-runtime" type="button">登记本地运行时</button></div>
<label>启动参数（每行一项，可选）<textarea id="args" rows="2"></textarea></label><p class="muted">使用游戏自身的主入口、窗口与初始化流程。</p></fieldset>
<p id="fields-error" role="alert"></p><div class="panel-footer"><span class="muted">点击保存才提交；关闭不保存。</span><div class="actions"><button id="cancel" type="button">取消</button><button id="save" class="primary" type="submit">保存设置</button></div></div></form></div></section>
<section id="runtime-panel" class="overlay" role="dialog" aria-modal="true" aria-labelledby="runtime-title" hidden><div class="panel compact"><div class="panel-heading"><div><span class="eyebrow">独立登记，自动匹配</span><h2 id="runtime-title">本地运行时</h2></div><button id="close-runtime" aria-label="关闭运行时登记" type="button">×</button></div><p class="muted">选择原始 Electron.app 或其可执行文件，程序会检测实际版本。登记不会改变其他游戏的配置。</p><div id="runtime-list" class="runtime-list"></div><form id="runtime-form"><fieldset id="runtime-fields" class="plain-fieldset"><label>本地运行时位置<span class="picker"><input id="runtime-path" required><button type="button" id="choose-runtime">选择…</button></span></label><label>来源说明<input id="runtime-source" placeholder="例如官方发行包来源"></label></fieldset><p id="runtime-status" role="status"></p><div class="panel-footer"><span class="muted">此处明确登记后单独保存。</span><button id="inspect" class="primary" type="submit">探测并登记</button></div></form></div></section>
<script src="library.js"></script></body></html>
